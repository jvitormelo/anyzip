name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Skip fat LTO in CI checks (release.yml still builds shipped binaries with fat LTO).
  CARGO_PROFILE_RELEASE_LTO: "off"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install # from rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - name: Install bsdtar
        run: |
          timeout 2 getent hosts azure.archive.ubuntu.com >/dev/null || printf 'https://mirrors.edge.kernel.org/ubuntu/\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libarchive-tools
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace # unit, proptest and golden (fixtures/expected)
      - run: cargo build -p anyzip --example dump
      # Any difference from bsdtar not explained in fixtures/diffs.json fails.
      - run: python3 -I scripts/diff-bsdtar.py --dump target/debug/examples/dump $(ls -d fixtures/libarchive/* fixtures/generated/* | grep -vE '/(COMMIT|COPYING)$')

  js:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - working-directory: npm
        run: |
          bun run build
          bun run typecheck
          bun test
          node --test test/*.test.ts
